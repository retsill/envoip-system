# EnVoip System: acceso al servidor web. deploy.sh la instala en /etc/apache2/conf.d/envoip-gate.conf y sustituye
# @PUBLIC_HOST@, @WS_HOST@, @LOCAL_IPS@ y @GATE_DIR@ (las líneas «#HOST#» solo se activan si PUBLIC_HOST está en .env).
#
#  - Solo se entra por el dominio principal: cualquier otro nombre (dominio raíz, IP…) redirige a él.
#    El dominio del WebSocket SIP solo sirve /ws.
#  - La raíz abre EnVoip System (/modern/), no la portada de ViciBox.
#  - El Vicidial clásico queda cerrado: /agc y /viciphone (pantalla del agente) solo con una sesión abierta en
#    EnVoip System; /vicidial y el resto (admin, informes, grabaciones…) solo si esa sesión es de administrador.
#    La llave es la cookie vm_gate + el archivo @GATE_DIR@/<agent|admin>/<llave> que crea server/src/gate.js.
#  - El propio servidor (scripts de Vicidial, la API que usa EnVoip System) entra siempre.
RewriteEngine On

# Certificados Let's Encrypt (webroot)
RewriteRule ^/\.well-known/acme-challenge/ - [L]

# Llamadas del propio servidor
RewriteCond %{REMOTE_ADDR} ^(@LOCAL_IPS@)$
RewriteRule ^ - [L]

#HOST#RewriteCond %{HTTP_HOST} ^@WS_HOST@(:\d+)?$ [NC]
#HOST#RewriteRule ^/ws(/|$) - [L]
#HOST#RewriteCond %{HTTP_HOST} !^@PUBLIC_HOST@(:\d+)?$ [NC]
#HOST#RewriteRule ^ https://@PUBLIC_HOST_RAW@%{REQUEST_URI} [R=301,L]

RewriteRule ^/(index\.html?)?$ /modern/ [R=302,L]

# Pantalla del agente: cualquier sesión abierta en EnVoip System
RewriteCond %{HTTP_COOKIE} ^(?:.*?(?:^|;\s*)vm_gate=([a-f0-9]{64})(?:;|$))?
RewriteCond @GATE_DIR@/agent/%1 !-f
RewriteRule ^/(agc|viciphone)(/|$) /modern/ [R=302,L]

# Todo lo demás del Vicidial clásico: solo administradores con sesión abierta en EnVoip System
RewriteCond %{REQUEST_URI} !^/(modern|ws|agc|viciphone)(/|$)
RewriteCond %{REQUEST_URI} !^/(favicon\.ico|robots\.txt)$
RewriteCond %{HTTP_COOKIE} ^(?:.*?(?:^|;\s*)vm_gate=([a-f0-9]{64})(?:;|$))?
RewriteCond @GATE_DIR@/admin/%1 !-f
RewriteRule ^ /modern/ [R=302,L]
