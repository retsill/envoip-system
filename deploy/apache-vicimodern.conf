# Vicidial Moderno: Apache reenvía /modern al servicio Node (solo escucha en 127.0.0.1:3100).
# Al servirse en el mismo dominio que /agc, la pantalla clásica puede cargarse dentro de la app.
<Location /modern>
    ProxyPass http://127.0.0.1:3100/modern retry=0 timeout=60
    ProxyPassReverse http://127.0.0.1:3100/modern
</Location>
