# EnVoip System: Vicidial con PHP 8 llena el registro de Apache de avisos (Warning/Deprecated/Notice): varios GB al
# día de escritura continua en disco, que resta tiempo real al audio. Solo se registran los errores de verdad.
# 4437 = E_ERROR | E_PARSE | E_CORE_ERROR | E_COMPILE_ERROR | E_USER_ERROR | E_RECOVERABLE_ERROR
<Directory "/srv/www/htdocs">
    php_admin_value error_reporting 4437
</Directory>
